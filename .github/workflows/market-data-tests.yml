name: Laravel market data tests
on:
  pull_request:
    paths:
      - 'apps/api/app/Services/MarketData/**'
      - 'apps/api/tests/Feature/TwelveDataRateLimitTest.php'
      - 'apps/api/tests/Feature/HistoricalSecurityPriceImporterInvalidSymbolTest.php'
      - '.github/workflows/market-data-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --filter='TwelveDataRateLimitTest|HistoricalSecurityPriceImporterInvalidSymbolTest|BuildPortfolioAnalyticsRateLimitTest'
